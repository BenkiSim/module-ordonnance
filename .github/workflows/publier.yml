name: Synchroniser et publier

# Déclencheurs :
# - chaque push sur main (modification du module par Claude Code ou à la main)
# - chaque nuit (synchronisation de la base Notion)
# - à la demande : onglet Actions, "Synchroniser et publier", bouton "Run workflow"
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Exporter la base Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning::Secret NOTION_TOKEN absent : synchronisation Notion ignorée, publication des données existantes."
          else
            node scripts/export-notion.mjs
          fi

      - name: Enregistrer les données mises à jour
        run: |
          if git diff --quiet -- data/; then
            echo "Données inchangées."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/medicaments.json
            git commit -m "Synchronisation de la base Notion"
            git push
          fi

      - name: Tester le module
        run: node tests/run-tests.mjs

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploiement
        uses: actions/deploy-pages@v4
